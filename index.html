<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ HR + Lô</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{height:100%;margin:0}
#map{width:100%}

.leaflet-popup-content{
 width:260px!important;
 max-height:300px;
 overflow:auto;
}

.popup-table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}

.popup-table td{
 border-bottom:1px solid #ddd;
 padding:6px 4px;
}

.popup-table td:first-child{
 font-weight:bold;
}


.lo-label{
 background:none;
 border:none;
}

.lo-label div{
 background:white;
 border:2px solid #003b73;
 border-radius:50%;
 width:32px;
 height:32px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#003b73;
 font-weight:bold;
 font-size:14px;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map').setView([11,106],8);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap',
 maxZoom:19
}
).addTo(map);


function popupHTML(p){

let html='<table class="popup-table">';

for(let k in p){
 html+=`
 <tr>
 <td>${k}</td>
 <td>${p[k]}</td>
 </tr>`;
}

return html+'</table>';

}


// ===== LỚP HR CŨ =====

fetch('HR.geojson')
.then(r=>r.json())
.then(data=>{

let layer=L.geoJSON(data,{

style:{
 color:"#006400",
 weight:2,
 fillOpacity:0
},

onEachFeature:(f,l)=>{

if(f.properties){

l.bindPopup(
popupHTML(f.properties),
{
maxWidth:280,
autoPan:true
}
);

}

}

}).addTo(map);


if(layer.getBounds().isValid()){
map.fitBounds(layer.getBounds());
}

});



// ===== THÊM TEXT LÔ =====

fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{

L.geoJSON(data,{

pointToLayer:(feature,latlng)=>{

let p=feature.properties||{};

let text=
p.text_lo ||
p.Ten_Lo ||
p.TENLO ||
p.LO ||
p.NAME ||
'';


return L.marker(latlng,{
icon:L.divIcon({

className:'lo-label',

html:'<div>'+text+'</div>',

iconSize:[36,36]

})
});

}

}).addTo(map);

});


</script>

</body>
</html>
