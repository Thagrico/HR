<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGIS Thửa + Số Lô</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
.lo-label{background:none;border:0}
.lo-label div{
 background:white;
 border:1px solid #003b73;
 border-radius:50%;
 width:20px;height:20px;
 line-height:20px;
 text-align:center;
 color:#003b73;
 font-size:11px;
 font-weight:bold;
}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>

const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}).addTo(map);

function popup(p){
 let h='<table>';
 for(let k in p) h+=`<tr><td><b>${k}</b></td><td>${p[k]}</td></tr>`;
 return h+'</table>';
}

let thuaData=null;

// Lớp thửa
fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{
 thuaData=data;

 let layer=L.geoJSON(data,{
  style:{
   color:'#006400',
   weight:1,
   fillColor:'#8abf4f',
   fillOpacity:0.35
  },
  onEachFeature:(f,l)=>{
   l.bindPopup(popup(f.properties));
  }
 }).addTo(map);

 map.fitBounds(layer.getBounds());
});


// Lớp text lô: lấy vị trí điểm Text_lo,
// gán tên lô từ polygon gần/chứa điểm
fetch('Text_lo.geojson')
.then(r=>r.json())
.then(points=>{

 L.geoJSON(points,{
  pointToLayer:(f,ll)=>{

   let soLo='';

   if(thuaData){
    let pt=turf.point([ll.lng,ll.lat]);

    for(let poly of thuaData.features){
     try{
      if(turf.booleanPointInPolygon(pt,poly)){
       soLo=poly.properties.Ten_Lo || '';
       break;
      }
     }catch(e){}
    }

    if(!soLo){
     let min=999999;
     thuaData.features.forEach(poly=>{
      let c=turf.centroid(poly);
      let d=turf.distance(pt,c);
      if(d<min){
       min=d;
       soLo=poly.properties.Ten_Lo || '';
      }
     });
    }
   }

   return L.marker(ll,{
    interactive:false,
    icon:L.divIcon({
     className:'lo-label',
     html:'<div>'+soLo+'</div>',
     iconSize:[22,22]
    })
   });

  }
 }).addTo(map);

});

</script>
</body>
</html>
