<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>WebGIS Thửa + Số Lô</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{height:100%;margin:0}
.lo-label{
 background:none;
 border:none;
}
.lo-label div{
 transform:translate(-50%,-50%);
 white-space:nowrap;
 color:#003b73;
 font-size:12px;
 font-weight:bold;
 text-shadow:1px 1px 2px white;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map('map');

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}).addTo(map);


// THỬA
fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{
 let layer=L.geoJSON(data,{
  style:{
   color:'#006400',
   weight:1,
   fillColor:'#8abf4f',
   fillOpacity:0.35
  }
 }).addTo(map);

 map.fitBounds(layer.getBounds());
});


// TEXT LÔ - lấy trực tiếp Name từ Text_lo
fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{

 L.geoJSON(data,{
  pointToLayer:function(feature,latlng){

   let soLo = feature.properties.Name || '';

   let dx = 0;
   let dy = 0;

   // chỉ chỉnh riêng lô bị lệch, không ảnh hưởng các lô khác
   if(soLo === '51TL'){
      dx = -10;
   }

   return L.marker(latlng,{
    interactive:false,
    icon:L.divIcon({
     className:'lo-label',
     html:'<span style="transform:translate('+dx+'px,'+dy+'px)">'+soLo+'</span>',
     iconSize:[24,24],
     iconAnchor:[12,12]
    })
   });

  }
 }).addTo(map);

});
</script>
</body>
</html>
