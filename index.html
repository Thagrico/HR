<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>WebGIS Thửa + Lô</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
.leaflet-popup-content{
 max-height:250px;
 overflow-y:auto;
 width:300px!important;
}
.popup-table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}
.popup-table td{
 padding:4px;
 border-bottom:1px solid #ddd;
}
.popup-table td:first-child{
 font-weight:bold;
}
.lo-label{background:none;border:none}
.lo-label span{
display:flex;
align-items:center;
justify-content:center;
width:22px;
height:22px;
background:white;
border:1.5px solid #003b73;
border-radius:50%;
color:#003b73;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}
table{border-collapse:collapse;font-size:12px}
td{border-bottom:1px solid #ddd;padding:3px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function popupHTML(p){
 let h='<table class="popup-table">';
 for(let k in p){
   h+='<tr><td><b>'+k+'</b></td><td>'+p[k]+'</td></tr>';
 }
 return h+'</table>';
}

// Polygon thửa - giữ toàn bộ thông tin popup
fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{
 let layer=L.geoJSON(data,{
   style:{
    color:'#006400',
    weight:1,
    fillColor:'#8abf4f',
    fillOpacity:0.35
   },
   onEachFeature:function(f,l){
    l.bindPopup(popupHTML(f.properties || {}));
   }
 }).addTo(map);
 map.fitBounds(layer.getBounds());
});


// Text lô - chỉ chỉnh riêng 51TL
fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{
 L.geoJSON(data,{
  pointToLayer:function(f,ll){
   let soLo=(f.properties && f.properties.Name) ? f.properties.Name : '';
   let style='';
   if(soLo==='51TL') style='transform:translateX(-10px);';

   return L.marker(ll,{
    interactive:false,
    icon:L.divIcon({
     className:'lo-label',
     html:'<span style="'+style+'">'+soLo+'</span>',
     iconSize:[22,22],
     iconAnchor:[11,11]
    })
   });
  }
 }).addTo(map);
});
</script>
</body>
</html>
