<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>WebGIS Thửa + Lô</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
.leaflet-popup-content{
 max-height:250px;
 overflow-y:auto;
 width:300px!important;
}
.popup-table{
 width:100%;
 border-collapse:collapse;
 font-family:'Segoe UI', Arial, sans-serif;
 font-size:13px;
 line-height:1.4;
}
.popup-table td{
 padding:4px;
 border-bottom:1px solid #ddd;
}
.popup-table td:first-child{
 font-weight:bold;
}
.lo-label{background:none;border:none}
.lo-label span{
display:flex;
align-items:center;
justify-content:center;
width:22px;
height:22px;
background:white;
border:1.5px solid #003b73;
border-radius:50%;
color:#003b73;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}
table{border-collapse:collapse;font-size:12px}
td{border-bottom:1px solid #ddd;padding:3px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function popupHTML(p){
 const labels = {
  "Ten_Lo":"Tên lô / Plot name",
  "Dien_Tich":"Diện tích / Area",
  "DienTich":"Diện tích / Area",
  "Loai_Cay":"Loại cây / Crop type",
  "So_Cay":"Số cây / Number of trees",
  "Thang_Trong":"Tháng trồng / Planting month",
  "Nam_Trong":"Năm trồng / Planting year",
  "Mat_Do":"Mật độ / Density",
  "Loai_Giong":"Loại giống / Variety",

  "Do_doc":"Độ dốc / Slope",
  "Huong_doc":"Hướng dốc / Slope direction",

  "Kem_dt":"Kẽm dễ tiêu (Zn) / Available Zinc (Zn)",
  "Kem_td":"Kẽm trao đổi (Zn) / Exchangeable Zinc (Zn)",

  "Canxi_td":"Canxi trao đổi (Ca) / Exchangeable Calcium (Ca)",
  "Magie_td":"Magiê trao đổi (Mg) / Exchangeable Magnesium (Mg)",
  "Bo_dt":"Bo dễ tiêu (B) / Available Boron (B)",

  "N_ts":"Đạm tổng số (N) / Total Nitrogen (N)",
  "P2O5_ts":"Lân tổng số (P₂O₅) / Total Phosphorus (P₂O₅)",
  "P2O5_dt":"Lân dễ tiêu (P₂O₅) / Available Phosphorus (P₂O₅)",
  "K2Ots":"Kali tổng số (K₂O) / Total Potassium (K₂O)",
  "K2Odt":"Kali dễ tiêu (K₂O) / Available Potassium (K₂O)",

  "Cadimi":"Cadimi (Cd) / Cadmium (Cd)",
  "Cd":"Cadimi (Cd) / Cadmium (Cd)",
  "Asen":"Asen (As) / Arsenic (As)",
  "As":"Asen (As) / Arsenic (As)",
  "Chi":"Chì (Pb) / Lead (Pb)",
  "Pb":"Chì (Pb) / Lead (Pb)",
  "Thuy ngan":"Thủy ngân (Hg) / Mercury (Hg)",
  "Thuy_ngan":"Thủy ngân (Hg) / Mercury (Hg)",
  "Hg":"Thủy ngân (Hg) / Mercury (Hg)",

  "Khu_Lien_Hop":"Khu liên hợp / Complex",
  "Cong_Ty":"Công ty / Company",
  "Xi_Nghiep":"Xí nghiệp / Enterprise",
  "Nong_Truong":"Nông trường / Farm",
  "Khu_Vuc":"Khu vực / Area",

  "Loai_dat":"Loại đất / Soil type",
  "Ghi_Chu":"Ghi chú / Note"
,
   "Kinh_Do":"Kinh độ / Longitude",
   "Vi_Do":"Vĩ độ / Latitude",
   "Cao_Do":"Cao độ / Elevation",
   "Khu_Lien_Hop":"Khu liên hợp / Complex",
   "Luong_Mua":"Lượng mưa / Rainfall",
   "T_max":"Nhiệt độ tối cao (T max) / Maximum temperature (T max)",
   "T_min":"Nhiệt độ tối thấp (T min) / Minimum temperature (T min)",
   "T_TB":"Nhiệt độ trung bình (Nhiệt độ trung bình (T TB)) / Average temperature (T mean)",
   "Huong_doc":"Hướng dốc / Slope direction",
   "Tang_day":"Tầng dày / Soil depth"
};

 let h='<table class="popup-table">';
 for(let k in p){
   let title = k;
   h += '<tr><td><b>'+title+'</b></td><td>'+p[k]+'</td></tr>';
 }
 return h+'</table>';
}

// Polygon thửa - giữ toàn bộ thông tin popup
fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{
 let layer=L.geoJSON(data,{
   style:function(f){
     let maLo = (f.properties && f.properties.LO) ? f.properties.LO.toString() : '';

     if(maLo.startsWith('N')){
        return {
          color:'#555555',
          weight:2,
          fillColor:'#A9A9A9',
          fillOpacity:0.55
        };
     }

     return {
       color:'#006400',
       weight:1,
       fillColor:'#8abf4f',
       fillOpacity:0.35
     };
   },
   onEachFeature:function(f,l){
    l.bindPopup(popupHTML(f.properties || {}));
   }
 }).addTo(map);
 map.fitBounds(layer.getBounds());
});


// Text lô - chỉ chỉnh riêng 51TL
fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{
 L.geoJSON(data,{
  pointToLayer:function(f,ll){
   let soLo=(f.properties && f.properties.Name) ? f.properties.Name : '';
   let style='';
   if(soLo==='51TL') style='transform:translateX(-10px);';

   return L.marker(ll,{
    interactive:false,
    icon:L.divIcon({
     className:'lo-label',
     html:'<span style="'+style+'">'+soLo+'</span>',
     iconSize:[22,22],
     iconAnchor:[11,11]
    })
   });
  }
 }).addTo(map);
});
</script>
</body>
</html>
