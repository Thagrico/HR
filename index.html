<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ Thửa + Lô</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{height:100%;margin:0}
#map{width:100%}

.leaflet-popup-content{
 width:260px!important;
 max-height:300px;
 overflow:auto;
}

.popup-table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}

.popup-table td{
 border-bottom:1px solid #ddd;
 padding:5px;
}

.popup-table td:first-child{
 font-weight:bold;
}


.lo-label{
 background:none;
 border:none;
}

.lo-label span{
 width:28px;
 height:28px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:white;
 border:2px solid #003b73;
 border-radius:50%;
 color:#003b73;
 font-size:14px;
 font-weight:bold;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map').setView([11,106],8);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap',
 maxZoom:19
}
).addTo(map);



function popupHTML(p){

let html='<table class="popup-table">';

for(let k in p){

html += `
<tr>
<td>${k}</td>
<td>${p[k]}</td>
</tr>`;

}

html+='</table>';

return html;

}



// =====================
// LOAD THUA
// =====================

let thuaLayer;


fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{


thuaLayer=L.geoJSON(data,{

style:{
color:"#00a8ff",
weight:1,
fillColor:"#8abf4f",
fillOpacity:0.6
},


onEachFeature:(f,l)=>{

if(f.properties){

l.bindPopup(
popupHTML(f.properties)
);

}

}


}).addTo(map);



if(thuaLayer.getBounds().isValid())
map.fitBounds(thuaLayer.getBounds());


});




// =====================
// LOAD TEXT LO
// =====================


fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{


L.geoJSON(data,{

pointToLayer:(feature,latlng)=>{


let text="";


if(feature.properties)
text=feature.properties.text_lo || "";


return L.marker(latlng,{

icon:L.divIcon({

className:"lo-label",

html:
"<span>"+text+"</span>",

iconSize:[32,32]

})

});


}


}).addTo(map);


});



</script>

</body>
</html>
