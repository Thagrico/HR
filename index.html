<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGIS Thửa + Lô</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
    height:100%;
    margin:0;
}
#map{
    width:100%;
}

.popup-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}
.popup-table td{
    border-bottom:1px solid #ddd;
    padding:5px;
}
.popup-table td:first-child{
    font-weight:bold;
}

.lo-label{
    background:none;
    border:none;
}

.lo-label span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    background:white;
    border:2px solid #003b73;
    border-radius:50%;
    color:#003b73;
    font-weight:bold;
    font-size:13px;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map').setView([11,106],8);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap',
 maxZoom:19
}
).addTo(map);


function popupHTML(p){
    let html='<table class="popup-table">';
    for(let k in p){
        html += `<tr><td>${k}</td><td>${p[k]}</td></tr>`;
    }
    return html+'</table>';
}


// =======================
// LỚP THỬA
// =======================

fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{

let thua=L.geoJSON(data,{

style:{
    color:"#006400",
    weight:2,
    fillColor:"#8abf4f",
    fillOpacity:0.45
},

pointToLayer:function(feature,latlng){

    return L.circleMarker(latlng,{
        radius:8,
        color:"#006400",
        weight:2,
        fillColor:"#8abf4f",
        fillOpacity:0.8
    });

},

onEachFeature:function(f,l){

    if(f.properties){
        l.bindPopup(popupHTML(f.properties));
    }

}

}).addTo(map);


if(thua.getBounds().isValid()){
    map.fitBounds(thua.getBounds());
}

});



// =======================
// NHÃN LÔ
// =======================

fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{

L.geoJSON(data,{

pointToLayer:function(feature,latlng){

let ten =
feature.properties.Ten_Lo ||
feature.properties.NAME ||
'';


return L.marker(latlng,{
    icon:L.divIcon({
        className:'lo-label',
        html:'<span>'+ten+'</span>',
        iconSize:[36,36]
    })
});

}

}).addTo(map);

});

</script>
</body>
</html>
