<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGIS Thửa + Lô</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
    height:100%;
    margin:0;
}
#map{
    width:100%;
}

.leaflet-popup-content{
    width:300px!important;
    max-height:350px;
    overflow:auto;
}

.popup-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}
.popup-table td{
    border-bottom:1px solid #ddd;
    padding:5px;
}
.popup-table td:first-child{
    font-weight:bold;
}

.lo-label{
    background:none;
    border:none;
}

.lo-label span{
    display:flex;
    justify-content:center;
    align-items:center;
    width:32px;
    height:32px;
    border-radius:50%;
    background:white;
    border:2px solid #003b73;
    color:#003b73;
    font-size:14px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([11,106],8);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap',
 maxZoom:19
}
).addTo(map);


function popupHTML(p){

let html='<table class="popup-table">';

for(let k in p){
    html += `
    <tr>
    <td>${k}</td>
    <td>${p[k] ?? ''}</td>
    </tr>`;
}

return html+'</table>';

}


// ==========================
// LỚP THỬA POLYGON
// ==========================

fetch('Thua.geojson')
.then(r=>r.json())
.then(data=>{

let thuaLayer=L.geoJSON(data,{

style:function(feature){

return {
    color:"#006400",
    weight:1.5,
    fillColor:"#8abf4f",
    fillOpacity:0.45
};

},

onEachFeature:function(feature,layer){

layer.bindPopup(
popupHTML(feature.properties),
{
maxWidth:320
}
);

}

}).addTo(map);


if(thuaLayer.getBounds().isValid()){
    map.fitBounds(thuaLayer.getBounds());
}

});



// ==========================
// NHÃN LÔ
// ==========================

fetch('Text_lo.geojson')
.then(r=>r.json())
.then(data=>{

L.geoJSON(data,{

pointToLayer:function(feature,latlng){

let ten=feature.properties.Ten_Lo || '';

return L.marker(latlng,{
icon:L.divIcon({

className:'lo-label',

html:'<span>'+ten+'</span>',

iconSize:[36,36]

})
});

}

}).addTo(map);

});

</script>

</body>
</html>
