<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ HR</title>
<style>
html,body{margin:0;padding:0;height:100%;font-family:Tahoma,'Arial Unicode MS','Noto Sans',Arial,sans-serif;background:#eef2f3;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#map{width:100%;height:100vh;background:#dfe7e9}
#status{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;max-width:min(92vw,760px);padding:7px 11px;border-radius:7px;background:rgba(255,255,255,.96);box-shadow:0 2px 10px rgba(0,0,0,.20);font-size:12px;color:#333;text-align:center}
#status.ok{display:none}#status.warn{background:#fff7dc;color:#704b00}#status.error{background:#ffe8e8;color:#8b0000}
.legend{background:#fff;padding:7px 8px;border-radius:7px;box-shadow:0 0 7px rgba(0,0,0,.22);line-height:18px;font-size:11px}
.leaflet-interactive{transition:none}
.xn-label{color:#8B0000;font-size:20px;font-weight:700;text-shadow:1px 1px 2px #fff,-1px -1px 2px #fff,1px -1px 2px #fff,-1px 1px 2px #fff}
.thua-label{color:#000;font-size:12px;font-weight:700;white-space:nowrap;text-shadow:1px 1px 2px #fff,-1px -1px 2px #fff,1px -1px 2px #fff,-1px 1px 2px #fff}
.lo-label{width:22px;height:22px;line-height:20px;text-align:center;background:rgba(255,255,255,.88);border:1.5px solid #036;border-radius:50%;color:#036;font-size:11px;font-weight:700;box-sizing:border-box}

/* Popup ép gọn tối đa nhưng vẫn đọc rõ */
.clean-plot-popup .leaflet-popup-content-wrapper{padding:0;border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.24)}
.clean-plot-popup .leaflet-popup-content{margin:0;width:382px!important;max-width:calc(100vw - 46px);max-height:74vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overscroll-behavior-x:none;touch-action:pan-x pan-y pinch-zoom}
.clean-plot-popup .leaflet-popup-close-button{width:24px!important;height:24px!important;line-height:22px!important;font-size:18px!important;color:#444!important;background:rgba(255,255,255,.94)!important;border-radius:50%;right:4px!important;top:4px!important;z-index:5}
.map-popup-table-wrap{padding:0}
.popup-table{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}
.popup-table td{border:0;border-bottom:1px solid #e5e9e6;padding:4px 6px;font-size:11.5px;line-height:1.18;vertical-align:top;color:#20252a;overflow-wrap:anywhere;word-break:normal}
.popup-table td:first-child{width:46%;font-weight:600;background:#f3f7f4;color:#263b2b}
.popup-table td:last-child{font-weight:400;background:#fff}

.fert-box{border-top:2px solid #91cfdb;background:#fff}
.fert-title{padding:4px 29px 4px 6px;background:#cdeff6;color:#18343a;line-height:1.05}
.fert-title-vi{font-size:11px;font-weight:700;white-space:nowrap}
.fert-title-en{display:inline;font-size:7.5px;font-weight:400;opacity:.9;margin-left:4px;white-space:nowrap}
.fert-title-unit{font-size:8px;font-weight:400;opacity:.92}
.fert-table-wrap{overflow-x:scroll;overflow-y:hidden;max-width:100%;background:#fff;overscroll-behavior-x:contain;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-behavior:auto;cursor:grab;-webkit-user-select:none;user-select:none}
.fert-table-wrap *{touch-action:inherit}
.fert-table{border-collapse:separate;border-spacing:0;width:936px;min-width:936px;font-size:8px;line-height:1.02;table-layout:fixed}
.fert-table th,.fert-table td{box-sizing:border-box;border-right:1px solid #dfe5e0;border-bottom:1px solid #dfe5e0;padding:2px 1px;text-align:center;vertical-align:top;white-space:nowrap;background:#fff;color:#222;min-width:32px;width:32px;height:23px}
.fert-table thead th{position:sticky;top:0;z-index:2;background:#cdeff6;color:#18343a;font-weight:700;border-top:1px solid #91cfdb;height:26px}
.fert-table th:first-child,.fert-table td:first-child{position:sticky;left:0;z-index:1;text-align:left;min-width:130px;width:130px;max-width:130px;white-space:normal;background:#fff;border-left:1px solid #dfe5e0;overflow:visible;padding:3px 4px}
.fert-table thead th:first-child{z-index:3;background:#cdeff6}
.fert-line-vi{font-size:8.5px;font-weight:700;color:#263b2b;line-height:1.08;white-space:normal;overflow-wrap:anywhere}
.fert-line-en{font-size:6.7px;font-weight:400;color:#69736c;line-height:1.05;margin-top:1px;white-space:normal;overflow-wrap:anywhere}
.fert-table .header-en{display:block;font-size:6.8px;color:#5e6b61;font-weight:400;margin-top:1px}
.fert-table td.changed-up,.fert-table td.changed-down,.fert-table td.unchanged,.fert-table td.tm-cell{background:#fff;color:#222;font-weight:400}
.fert-table thead th.tm-cell{background:#cdeff6;color:#18343a;font-weight:700}

@media (max-width:700px){
 .clean-plot-popup .leaflet-popup-content{width:min(326px,calc(100vw - 42px))!important;max-width:calc(100vw - 42px)!important;max-height:66vh}
 .popup-table td{font-size:10.8px;line-height:1.15;padding:3px 5px}.popup-table td:first-child{width:49%}
 .fert-title{padding:4px 27px 4px 5px}.fert-title-vi{font-size:10px}.fert-title-en{font-size:7px}.fert-title-unit{font-size:7.5px}
 .fert-table{width:936px;min-width:936px;font-size:7.5px}.fert-table th,.fert-table td{min-width:32px;width:32px;padding:2px 1px;vertical-align:top}
 .fert-table th:first-child,.fert-table td:first-child{min-width:130px;width:130px;max-width:130px}
 .fert-line-vi{font-size:7.8px}.fert-line-en{font-size:6.2px}
}
</style>
</head>
<body>
<div id="status">Đang khởi tạo bản đồ…</div>
<div id="map"></div>
<script>
(function(){
'use strict';
const statusBox=document.getElementById('status');
function status(msg,type=''){statusBox.textContent=msg;statusBox.className=type}
function loadCss(url){return new Promise((resolve,reject)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=url;l.onload=resolve;l.onerror=reject;document.head.appendChild(l)})}
function loadScript(url,timeout=9000){return new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const t=setTimeout(()=>{if(!done){done=true;s.remove();reject(new Error('Timeout '+url))}},timeout);s.src=url;s.onload=()=>{if(!done){done=true;clearTimeout(t);resolve()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);reject(new Error('Không tải được '+url))}};document.head.appendChild(s)})}
async function loadLeaflet(){
 const cssUrls=['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'];
 const jsUrls=['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'];
 for(const u of cssUrls){try{await loadCss(u);break}catch(e){}}
 for(const u of jsUrls){try{await loadScript(u);if(window.L)return}catch(e){}}
 throw new Error('Không tải được thư viện Leaflet. Hãy kiểm tra kết nối mạng.');
}
function fetchJson(url,timeout=12000){return new Promise((resolve,reject)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);fetch(url,{cache:'no-store',signal:c.signal}).then(r=>{if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()}).then(v=>{clearTimeout(t);resolve(v)}).catch(e=>{clearTimeout(t);reject(e)})})}
async function fetchFirst(candidates){let last;for(const name of candidates){try{return {data:await fetchJson(name),name}}catch(e){last=e}}throw new Error(candidates[0]+': '+(last?.message||'không tìm thấy'))}
function escapeHtml(v){return String(v).normalize('NFC').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function stripAccents(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function normalizedKey(v){return stripAccents(String(v)).replace(/[()]/g,' ').replace(/[._/\\-]+/g,' ').replace(/\s+/g,' ').trim()}
function sentenceCase(v){const s=String(v).trim().replace(/[_-]+/g,' ').replace(/\s+/g,' ');if(!s)return '';if(/^dp3$/i.test(s))return 'DP3';if(/^ec$/i.test(s))return 'EC';if(/^om$/i.test(s))return 'OM';return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()}
function formatFieldName(key){
 const raw=String(key).trim(),n=normalizedKey(raw);
 const names={
  'kinh do':'Kinh độ (Longitude)','longitude':'Kinh độ (Longitude)','long':'Kinh độ (Longitude)','lng':'Kinh độ (Longitude)',
  'vi do':'Vĩ độ (Latitude)','latitude':'Vĩ độ (Latitude)','lat':'Vĩ độ (Latitude)',
  'xi nghiep':'Xí nghiệp (Enterprise)','enterprise':'Xí nghiệp (Enterprise)','xn':'Xí nghiệp (Enterprise)',
  'nong truong':'Nông trường (Farm)','farm':'Nông trường (Farm)','nt':'Nông trường (Farm)',
  'doi':'Đội (Team)','team':'Đội (Team)','lo':'Lô (Lot)','lot':'Lô (Lot)','block':'Lô (Lot)','thua':'Thửa (Plot)','plot':'Thửa (Plot)',
  'do day tang dat min':'Độ dày tầng đất tối thiểu (Minimum soil depth)','do day tang dat':'Độ dày tầng đất (Soil depth)','do day':'Độ dày (Thickness)',
  'do doc':'Độ dốc (Slope)','do cao':'Độ cao (Elevation)','do xop':'Độ xốp (Porosity)','xop':'Độ xốp (Porosity)',
  'chat luong vuon':'Chất lượng vườn (Plantation Quality)','plantation quality':'Chất lượng vườn (Plantation Quality)','cl vuon':'Chất lượng vườn (Plantation Quality)','clvuon':'Chất lượng vườn (Plantation Quality)',
  'mat do':'Mật độ (Density)','density':'Mật độ (Density)','giong':'Giống (Variety)','variety':'Giống (Variety)',
  'luong mua':'Lượng mưa (Rainfall)','luogn mua':'Lượng mưa (Rainfall)','rainfall':'Lượng mưa (Rainfall)','mua mua':'Mùa mưa (Rainy season)','mua kho':'Mùa khô (Dry season)',
  't max':'Nhiệt độ tối cao (T-max)','tmax':'Nhiệt độ tối cao (T-max)','t min':'Nhiệt độ tối thấp (T-min)','tmin':'Nhiệt độ tối thấp (T-min)','t tb':'Nhiệt độ trung bình (T-mean)','ttb':'Nhiệt độ trung bình (T-mean)','t mean':'Nhiệt độ trung bình (T-mean)','tmean':'Nhiệt độ trung bình (T-mean)',
  'ngap':'Ngập úng (Waterlogging)','ngap ung':'Ngập úng (Waterlogging)','do am':'Độ ẩm (Moisture)','doam':'Độ ẩm (Moisture)',
  'tpcg':'TPCG (Soil Texture)','tp cg':'TPCG (Soil Texture)','thanh phan co gioi':'TPCG (Soil Texture)',
  'dien tich':'Diện tích (Area)','dientich':'Diện tích (Area)','dt':'Diện tích (Area)','area':'Diện tích (Area)',
  'ec':'EC','om':'OM','ph':'pH','phh2o':'pH H₂O','ph h2o':'pH H₂O','ph nuoc':'pH H₂O','do ph':'pH','n':'N','p':'P','k':'K','mg':'Mg','zn':'Zn','b':'B','dp3':'DP3'
 };
 if(names[n])return names[n];
 return sentenceCase(raw);
}
function monthEnglish(num){return ['','January','February','March','April','May','June','July','August','September','October','November','December'][num]||''}
function formatMonthValue(raw){const s=stripAccents(raw).replace(/\s+/g,' ').trim();let m=s.match(/^(?:thang|t)?\s*(1[0-2]|[1-9])$/);if(m){const n=Number(m[1]);return `Tháng ${n} (${monthEnglish(n)})`}m=s.match(/^(?:thang|t)?\s*(1[0-2]|[1-9])\s*[-–—/]\s*(?:thang|t)?\s*(1[0-2]|[1-9])$/);if(m){const a=Number(m[1]),b=Number(m[2]);return `Tháng ${a}–${b} (${monthEnglish(a)}–${monthEnglish(b)})`}return null}
function normalizeNumericToken(token){
 let t=String(token).replace(/\s+/g,'');const sign=t.startsWith('-')?'-':t.startsWith('+')?'+':'';if(sign)t=t.slice(1);
 if(!/[.,]/.test(t))return sign+t;
 const dots=(t.match(/\./g)||[]).length,commas=(t.match(/,/g)||[]).length;
 if(dots&&commas){const dec=t.lastIndexOf('.')>t.lastIndexOf(',')?'.':',';const thousands=dec==='.'?',':'.';t=t.split(thousands).join('');if(dec===',')t=t.replace(',','.');return sign+t}
 if(commas){const p=t.split(',');if(commas>1&&p.slice(1).every(x=>x.length===3))return sign+p.join('');if(commas===1){const [a,b]=p;if(b.length===3&&a!=='0')return sign+a+b;return sign+a+'.'+b}}
 return sign+t;
}
function normalizeNumericText(raw){return String(raw).replace(/[-+]?\d[\d.,]*/g,m=>normalizeNumericToken(m))}
function normalizeDegreeAndUnits(raw,key){let s=String(raw).normalize('NFC').trim(),kn=normalizedKey(key);s=s.replace(/\b(?:o|0|º|°)\s*c\b/gi,'°C');s=s.replace(/(-?\d+(?:[.,]\d+)?)\s*(?:o|0|º|°)\s*c\b/gi,'$1 °C');if((kn.includes('nhiet do')||/^t\s*(min|max|tb|mean)$/.test(kn))&&/^[-+]?\d+(?:[.,]\d+)?$/.test(s))s+=' °C';s=s.replace(/\s*(cm|mm|km|ha|m²|m2|%|ppm|mg\/kg)\b/gi,' $1');s=s.replace(/\bm2\b/gi,'m²');return s}
function compactComparators(s){return String(s).replace(/([<>≤≥])\s+/g,'$1')}
function formatValue(value,key=''){
 if(value===null||typeof value==='undefined')return '';
 let raw=String(value).normalize('NFC').trim();if(!raw)return '';
 const n=stripAccents(raw).replace(/\s+/g,' ').trim(),kn=normalizedKey(key);
 if(kn.includes('thang')||kn.includes('mua mua')||kn.includes('mua kho')){const month=formatMonthValue(raw);if(month)return month}
 const exact={'tot':'Tốt (Good)','good':'Tốt (Good)','trung binh':'Trung bình (Fair)','tb':'Trung bình (Fair)','fair':'Trung bình (Fair)','kem':'Kém (Poor)','poor':'Kém (Poor)','trong moi':'Trồng mới (New)','tm':'Trồng mới (New)','new':'Trồng mới (New)','cat':'Cát (Sand)','set':'Sét (Clay)','thit':'Thịt (Loam)','set cat':'Sét cát (Sandy clay)','cat set':'Cát sét (Clayey sand)','set thit':'Sét thịt (Clay loam)','thit cat':'Thịt cát (Sandy loam)'};
 if(exact[n])return exact[n];
 return compactComparators(normalizeNumericText(normalizeDegreeAndUnits(raw,key)));
}
function collectProperties(feature){const out={};function add(obj,prefix=''){if(!obj||typeof obj!=='object'||Array.isArray(obj))return;Object.entries(obj).forEach(([k,v])=>{if(['type','geometry','bbox'].includes(k)||String(k).startsWith('__'))return;const key=prefix?prefix+' / '+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))add(v,key);else out[key]=Array.isArray(v)?v.join(', '):v})}add(feature&&feature.properties);if(!Object.keys(out).length)add(feature&&feature.attributes);return out}

function getPlotFert(properties){
 const s=readSoil(properties);
 if(![s.ph,s.om,s.n,s.p,s.k].some(Number.isFinite))return null;

 let best=null,bestDistance=Infinity;
 for(const ref of SOIL_PROFILE_REFS){
  const d=soilDistance(s,ref);
  if(d<bestDistance){bestDistance=d;best=ref}
 }
 if(!best)return null;

 // Giữ nguyên số liệu thật của GeoJSON để phân cấp và ghi chú.
 return [
  best[0],
  Number.isFinite(s.ph)?s.ph:best[1],
  Number.isFinite(s.om)?s.om:best[2],
  Number.isFinite(s.n)?s.n:best[3],
  Number.isFinite(s.p)?s.p:best[4],
  Number.isFinite(s.k)?s.k:best[5]
 ];
}

function idPart(v){
 const s=String(v??'').trim();
 if(/^[-+]?\d+(?:[.,]\d+)?$/.test(s)){const n=Number(s.replace(',','.'));if(Number.isFinite(n)&&Number.isInteger(n))return String(n)}
 return s.toLocaleLowerCase('vi');
}
function numberWithUnit(v,unit){return Number.isFinite(v)?formatPlainNumber(v,4)+(unit?' '+unit:''):''}
function mergedExcelProperties(properties){return {...(properties||{})}}
function levelOf(value,low,high){if(!Number.isFinite(value))return 'unknown';return value<low?'low':value>high?'high':'medium'}
function levelText(level){return level==='low'?'thấp':level==='high'?'cao':level==='medium'?'trung bình':'chưa có dữ liệu'}
function levelTextEn(level){return level==='low'?'low':level==='high'?'high':level==='medium'?'average':'no data'}
function fertilizerNote(groupId,record){
 const [,ph,om,n,p,k]=record||[];
 const omL=levelOf(om,2,4),nL=levelOf(n,100,200),pL=levelOf(p,100,150),kL=levelOf(k,150,250);
 if(groupId==='organic')return {vi:`TM: theo quy trình; các lần bón sau, OM ${levelText(omL)}: ${omL==='low'?'tăng 5%':omL==='high'?'giảm 5%':'theo quy trình'}`,en:`TM: standard protocol; later applications, ${levelTextEn(omL)} OM: ${omL==='low'?'+5%':omL==='high'?'-5%':'standard'}`};
 if(groupId==='lime'){
  if(!Number.isFinite(ph))return {vi:'Chưa có pH: chưa xác định vôi',en:'No pH: lime not determined'};
  if(ph<4)return {vi:'pH<4: 1000 g/cây tại T1 và T13',en:'pH<4: 1000 g/tree at T1 and T13'};
  if(ph<=6)return {vi:'pH 4–6: 500 g/cây tại T1 và T13',en:'pH 4–6: 500 g/tree at T1 and T13'};
  return {vi:'pH>6: không bón',en:'pH>6: no lime'};
 }
 if(groupId==='npk')return {vi:`TM: theo quy trình; từ T1–T24, P ${levelText(pL)}: ${pL==='low'?'tăng 5%':pL==='high'?'giảm 5%':'theo quy trình'}`,en:`TM: standard protocol; T1–T24, ${levelTextEn(pL)} P: ${pL==='low'?'+5%':pL==='high'?'-5%':'standard'}`};
 if(groupId==='phosphate')return {vi:'Chỉ bón khi trồng mới (TM), nên giữ nguyên theo quy trình',en:'Applied only at new planting (TM), therefore kept at the protocol dose'};
 if(groupId==='urea')return {vi:`N ${levelText(nL)}; lượng Urê đã bù N do NPK tăng/giảm`,en:`${levelTextEn(nL)} N; urea includes NPK nitrogen offset`};
 if(groupId==='kcl'||groupId==='k2so4')return {vi:`K ${levelText(kL)}; đã bù K₂O do NPK tăng/giảm`,en:`${levelTextEn(kL)} K; includes NPK K₂O offset`};
 return {vi:'Theo quy trình, không điều chỉnh theo phân cấp đất',en:'Protocol dose; no soil-class adjustment'};
}
function formatPlainNumber(v,maxDecimals=2){if(!Number.isFinite(v))return '';const p=Math.pow(10,maxDecimals);const r=Math.round((v+Number.EPSILON)*p)/p;return String(Object.is(r,-0)?0:r)}
function formatDose(v){return Number.isFinite(v)?formatPlainNumber(v,2):''}
function createFertilizerRecommendation(properties){
 const record=getPlotFert(properties);
 if(!record)return '<div class="fert-box"><div class="fert-title"><span class="fert-title-vi">Hướng dẫn bón phân</span><span class="fert-title-en">Fertilizer recommendation</span></div><div style="padding:8px;font-size:11px">Không đủ dữ liệu pH, OM, N, P, K để lập hướng dẫn bón phân.</div></div>';
 const profile=FERT_PROFILES[record[0]];
 let html='<div class="fert-box"><div class="fert-title"><span class="fert-title-vi">Hướng dẫn bón phân</span><span class="fert-title-en">Fertilizer recommendation</span><span class="fert-title-unit"> · g/cây</span></div><div class="fert-table-wrap"><table class="fert-table"><thead><tr><th>Loại phân<span class="header-en">Fertilizer</span></th>';
 FERT_STAGES.forEach((s,i)=>html+=`<th class="${i===0?'tm-cell':''}">${s}</th>`);html+='</tr></thead><tbody>';
 FERT_GROUPS.forEach((g,gi)=>{
  const note=fertilizerNote(g.id,record),stageValues=Object.fromEntries(g.stages.map((s,i)=>[s,profile[gi][i]]));
  html+=`<tr><td><div class="fert-line-vi">${escapeHtml(g.name)+' · '+escapeHtml(note.vi)}</div><div class="fert-line-en">${escapeHtml(g.en+' · '+note.en)}</div></td>`;
  FERT_STAGES.forEach((s,i)=>html+=`<td class="${i===0?'tm-cell':'unchanged'}">${formatDose(stageValues[s])}</td>`);html+='</tr>';
 });
 return html+'</tbody></table></div></div>';
}
function createPopup(feature){
 const p=collectProperties(feature);
 const entries=Object.entries(p).filter(([,v])=>v!==null&&v!==''&&typeof v!=='undefined');
 let html='<table class="popup-table">';
 if(!entries.length){
   html+='<tr><td colspan="2">Không có dữ liệu.</td></tr>';
 }else{
   entries.forEach(([k,v])=>{
     html+=`<tr><td>${escapeHtml(formatFieldName(k))}</td><td>${escapeHtml(formatValue(v,k))}</td></tr>`;
   });
 }
 return html+'</table>';
}
async function init(){
 try{await loadLeaflet()}catch(e){status(e.message,'error');return}
 const map=L.map('map',{fadeAnimation:false,zoomAnimation:false,markerZoomAnimation:false,preferCanvas:true}).setView([11,106],7);
 [['polygonPane',400],['linePane',500],['ranhPane',600],['labelPane',650]].forEach(([n,z])=>{map.createPane(n);map.getPane(n).style.zIndex=z});
 ['linePane','ranhPane','labelPane'].forEach(n=>map.getPane(n).style.pointerEvents='none');map.getPane('polygonPane').style.pointerEvents='auto';map.getPane('popupPane').style.zIndex=7000;
 map.on('popupopen',e=>requestAnimationFrame(()=>enableImmediatePopupTouch(e.popup)));
 const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',updateWhenIdle:true,keepBuffer:1,maxZoom:19}).addTo(map);
 const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19});
 L.control.layers({'Đường phố (Street)':osm,'Vệ tinh (Satellite)':sat},null,{position:'topleft',collapsed:true}).addTo(map);
 const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<span style="display:inline-block;width:12px;height:12px;background:#2E7D32;border:1px solid #666"></span> Tốt (Good)<br><span style="display:inline-block;width:12px;height:12px;background:#7CB342;border:1px solid #666"></span> TB (Fair)<br><span style="display:inline-block;width:12px;height:12px;background:#D8F0C8;border:1px solid #666"></span> Kém (Poor)<br><span style="display:inline-block;width:12px;height:12px;background:#B59B3A;border:1px solid #666"></span> TM (New)';return d};legend.addTo(map);
 const jobs=[
   ['HR',['HR.geojson']]
 ];
 status('Đang tải dữ liệu HR.geojson...');const results=await Promise.allSettled(jobs.map(j=>fetchFirst(j[1]))),errors=[];results.forEach((r,i)=>{if(r.status==='rejected')errors.push(jobs[i][0])});
 if(results[0].status!=='fulfilled'){status('Không tìm thấy file HR.geojson đặt cùng thư mục HTML.','error');return}
 const data=results[0].value.data;
 const layer=L.geoJSON(data,{pane:'polygonPane',style:f=>({color:'#fff',weight:1.2,opacity:1,fillColor:getQualityColor(f),fillOpacity:.91,lineJoin:'round'}),onEachFeature:(f,l)=>{
  l.bindPopup(()=>'<div class="map-popup-table-wrap">'+createPopup(f)+'</div>',{className:'clean-plot-popup',maxWidth:400,maxHeight:650,autoPan:true});
  const b=l.getBounds();if(b.isValid()){const nw=b.getNorthWest(),label=getPlotLabel(f.properties);if(label!=='')L.marker([nw.lat-.00004,nw.lng+.00004],{pane:'labelPane',interactive:false,icon:L.divIcon({className:'thua-label',html:escapeHtml(label),iconSize:null})}).addTo(map)}
 }}).addTo(map);
 if(layer.getBounds().isValid())map.fitBounds(layer.getBounds(),{padding:[12,12]});
 if(errors.length)status('Bản đồ đã mở. Chưa tải được: '+errors.join(', ')+'.','warn');else status('','ok');
}
init();
})();
</script>
